<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kali Linux Terminal</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1e1e1e;
            color: white;
            font-family: monospace;
        }
        #terminal {
            width: 90%;
            max-width: 800px;
            height: 80vh;
            background-color: black;
            overflow: auto;
            padding: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div id="terminal"></div>
    <script src="https://bellard.org/bpg/JS/Linux.js"></script>
    <script>
        // Inicializa el emulador de Kali Linux
        const terminal = document.getElementById('terminal');
        const jsLinux = new JSLinux(terminal);
        jsLinux.start();
    </script>
</body>
</html>
