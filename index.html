<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Interactivo de Estados Unidos (incluyendo Alaska)</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        /* Reset básico */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }
        /* Contenedor del mapa */
        #map {
            width: 100%;
            height: 100vh; /* Ocupa toda la altura de la pantalla */
        }
    </style>
</head>
<body>
    <!-- Contenedor del mapa -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        // Coordenadas de Estados Unidos (incluyendo Alaska)
        const usCenter = [50, -120]; // Centro del mapa para incluir Alaska y el territorio continental
        const usBounds = L.latLngBounds(
            L.latLng(18.9111, -179.9999), // Esquina inferior izquierda (límite sur y oeste, incluyendo Alaska)
            L.latLng(71.5388, -66.9346)   // Esquina superior derecha (límite norte y este)
        );

        // Inicializar el mapa centrado en una vista que incluya Alaska
        const map = L.map('map').setView(usCenter, 3); // Zoom inicial 3

        // Añadir capa de OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Establecer límites del mapa para Estados Unidos (incluyendo Alaska)
        map.setMaxBounds(usBounds); // Limita el desplazamiento a Estados Unidos
        map.on('drag', () => {
            if (!usBounds.contains(map.getCenter())) {
                map.panInsideBounds(usBounds, { animate: true });
            }
        });

        // Ejemplo de marcadores en Estados Unidos (incluyendo Alaska)
        const markers = [
            {
                name: "Nueva York",
                latlng: [40.7128, -74.0060], // Coordenadas de Nueva York
                url: "https://www.example.com/nueva-york" // Enlace de redirección
            },
            {
                name: "Los Ángeles",
                latlng: [34.0522, -118.2437], // Coordenadas de Los Ángeles
                url: "https://www.example.com/los-angeles" // Enlace de redirección
            },
            {
                name: "Chicago",
                latlng: [41.8781, -87.6298], // Coordenadas de Chicago
                url: "https://www.example.com/chicago" // Enlace de redirección
            },
            {
                name: "Houston",
                latlng: [29.7604, -95.3698], // Coordenadas de Houston
                url: "https://www.example.com/houston" // Enlace de redirección
            },
            {
                name: "Miami",
                latlng: [25.7617, -80.1918], // Coordenadas de Miami
                url: "https://www.example.com/miami" // Enlace de redirección
            },
            {
                name: "Las Vegas",
                latlng: [36.1699, -115.1398], // Coordenadas de Las Vegas
                url: "https://www.example.com/las-vegas" // Enlace de redirección
            },
            {
                name: "Anchorage (Alaska)",
                latlng: [61.2181, -149.9003], // Coordenadas de Anchorage, Alaska
                url: "https://www.example.com/anchorage" // Enlace de redirección
            }
            // Añade más marcadores aquí
        ];

        // Añadir marcadores al mapa
        markers.forEach(marker => {
            const { name, latlng, url } = marker;
            L.marker(latlng)
                .addTo(map)
                .bindPopup(`<b>${name}</b><br><a href="${url}" target="_blank">Más información</a>`)
                .on('click', () => {
                    window.open(url, '_blank'); // Abrir enlace en una nueva pestaña
                });
        });

        // Asegurar que el mapa se redimensione correctamente
        window.addEventListener('resize', () => {
            map.invalidateSize();
        });
    </script>
</body>
</html>
