        :root {
            --primary-color: #3498db;
            --secondary-color: #2980b9;
            --background-color: #f9f9f9;
            --card-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
        }

        p.subtitle {
            font-size: 1.2rem;
            color: #666;
            max-width: 700px;
            margin: 0 auto;
        }

        .locations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .location-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            text-align: center;
            cursor: pointer;
        }

        .location-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }

        .flag-container {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f0f0;
        }

        .flag-icon {
            font-size: 4rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .location-info {
            padding: 1.5rem 1rem;
        }

        .location-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
        }

        .location-state {
            color: #666;
            font-size: 0.9rem;
        }

        .location-county {
            color: #888;
            font-size: 0.8rem;
        }

        .search-container {
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        #location-search {
            width: 100%;
            padding: 12px 20px;
            border: 1px solid #ddd;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
        }

        #location-search:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #eee;
            color: #777;
        }

        @media (max-width: 768px) {
            .locations-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }

            h1 {
                font-size: 2rem;
            }

            .flag-container {
                height: 100px;
            }

            .flag-icon {
                font-size: 3rem;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }

            }

        }

        // Function to render locations
        function renderLocations(locationList) {
            const container = document.getElementById('locations-container');
            container.innerHTML = '';

            locationList.forEach(location => {
                const locationCard = document.createElement('div');
                locationCard.className = 'location-card';
                locationCard.innerHTML = `
                    <div class="flag-container">
                        <span class="flag-icon">${location.state.charAt(0)}${location.city.charAt(0)}</span>
                    </div>
                    <div class="location-info">
                        <div class="location-name">${location.city}</div>
                        <div class="location-county">${location.county} County</div>
                        <div class="location-state">${location.state}</div>
                    </div>
                `;
                
                locationCard.addEventListener('click', () => {
                    window.location.href = location.url;
                });

                container.appendChild(locationCard);
            });
        }

        // Function to search locations
        function searchLocations() {
            const searchTerm = document.getElementById('location-search').value.toLowerCase();
            const filteredLocations = locations.filter(location => 
                location.city.toLowerCase().includes(searchTerm) || 
                location.county.toLowerCase().includes(searchTerm) ||
                location.state.toLowerCase().includes(searchTerm)
            );
            renderLocations(filteredLocations);
        }

        // Event listeners
        document.getElementById('location-search').addEventListener('input', searchLocations);

        // Render all locations when page loads
        document.addEventListener('DOMContentLoaded', () => {
            renderLocations(locations);
        });
    </script>
